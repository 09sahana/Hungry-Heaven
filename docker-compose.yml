services:
  app:
    build: .
    container_name: hungry-heaven-app
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_USER: hungryuser
      DB_PASSWORD: hungrypassword123
      DB_NAME: hungry_heaven
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: hungry-heaven-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: hungry_heaven
      MYSQL_USER: hungryuser
      MYSQL_PASSWORD: hungrypassword123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/hungry_heaven.sql:/docker-entrypoint-initdb.d/hungry_heaven.sql

volumes:
  mysql_data: